<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Particle Wallpaper</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05060f;font-family:system-ui,sans-serif;touch-action:none}
  canvas{display:block;width:100vw;height:100vh}
  .ui{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
      width:min(92vw,420px);max-height:68vh;overflow-y:auto;touch-action:pan-y;box-sizing:border-box;
      display:flex;flex-direction:column;gap:12px;
      background:rgba(10,12,25,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      padding:14px;border-radius:16px;color:#dfe6ff;font-size:13px}
  .ui.hidden{display:none}
  .ui label{display:flex;align-items:center;justify-content:space-between;gap:10px}
  input[type=range]{width:55%}
  .row{display:flex;gap:10px}
  button{flex:1;border:0;border-radius:10px;padding:10px 12px;background:#3b5bff;color:#fff;font-size:14px;cursor:pointer}
  button.secondary{background:rgba(255,255,255,.12)}
  #setwp{display:none}
  #gear{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;flex:none;padding:8px 14px;
        font-size:13px;background:rgba(10,12,25,.78);color:#dfe6ff;border-radius:20px}

  .grp{display:flex;flex-direction:column;gap:8px}
  .grp-title{font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.65}
  .sw-row{display:flex;gap:7px;flex-wrap:wrap}
  button.sw{flex:none;width:28px;height:28px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.22)}
  button.sw.sel{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.3)}
  button.sw.custom{background:conic-gradient(#f33,#fd3,#3f6,#3df,#36f,#f3f,#f33)}
  .custom-box{display:none;flex-direction:column;gap:8px}
  .custom-box.open{display:flex}
  .custom-box input[type=range]{-webkit-appearance:none;appearance:none;height:10px;border-radius:5px;outline:none}
  .custom-box input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;
      border-radius:50%;background:#fff;border:2px solid #3b5bff}
  .custom-box input.hue{background:linear-gradient(to right,hsl(0,85%,50%),hsl(60,85%,50%),hsl(120,85%,50%),
      hsl(180,85%,50%),hsl(240,85%,50%),hsl(300,85%,50%),hsl(360,85%,50%))}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="gear">Hide</button>
<div class="ui" id="ui">
  <label>Particles <input id="count" type="range" min="30" max="350" value="140"></label>
  <label>Speed <input id="speed" type="range" min="0" max="30" value="8"></label>
  <label>Links <input id="links" type="range" min="0" max="220" value="120"></label>

  <div class="grp" id="bgPick">
    <div class="grp-title">Background</div>
    <div class="sw-row"></div>
    <div class="custom-box">
      <label>Hue <input class="hue" type="range" min="0" max="360" value="220"></label>
      <label>Shade <input class="light" type="range" min="0" max="100" value="5"></label>
    </div>
  </div>

  <div class="grp" id="fgPick">
    <div class="grp-title">Particles &amp; bonds</div>
    <div class="sw-row"></div>
    <div class="custom-box">
      <label>Hue <input class="hue" type="range" min="0" max="360" value="200"></label>
      <label>Shade <input class="light" type="range" min="0" max="100" value="65"></label>
    </div>
  </div>

  <div class="row">
    <button id="theme" class="secondary">Theme</button>
    <button id="setwp">Set as wallpaper</button>
  </div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const HAS_ANDROID = typeof window.Android !== 'undefined';
let W,H,particles=[],mouse={x:-9999,y:-9999};
const countInput=document.getElementById('count'),speedInput=document.getElementById('speed'),linkInput=document.getElementById('links');

// ---- colour helpers -------------------------------------------------------
function hexToRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('')}
function hslToHex(h,s,l){
  s/=100;l/=100;
  const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return rgbToHex(f(0)*255,f(8)*255,f(4)*255);
}
function hexToHsl(hex){
  const [r,g,b]=hexToRgb(hex).map(v=>v/255);
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
  let h=0,s=0;
  if(d){
    s=d/(1-Math.abs(2*l-1));
    if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;
    h*=60;if(h<0)h+=360;
  }
  return [h,s*100,l*100];
}

// ---- colour state ---------------------------------------------------------
const THEMES=[
  {bg:'#05060f',fg:'#55c1f6'},  // original blue
  {bg:'#02040a',fg:'#78dcff'},  // ice
  {bg:'#0b0714',fg:'#f471f4'},  // magenta
  {bg:'#04100a',fg:'#5bf29b'},  // forest
  {bg:'#140808',fg:'#ff8a5b'},  // ember
  {bg:'#000000',fg:'#ffffff'},  // mono
  {bg:'#f4f4f8',fg:'#3b5bff'}   // light
];
const BG_PRESETS=['#05060f','#000000','#0b0714','#04100a','#140808','#0a1a2f','#1c1c22','#f4f4f8'];
const FG_PRESETS=['#55c1f6','#ffffff','#ff5c8a','#b36bff','#5bf29b','#ffd23f','#ff8a5b','#ff3b3b'];

let bg=THEMES[0].bg, fg=THEMES[0].fg, themeIdx=0, fgRGB=hexToRgb(fg);

function makePicker(rootId,presets,getColor,setColor){
  const root=document.getElementById(rootId);
  const row=root.querySelector('.sw-row'),box=root.querySelector('.custom-box');
  const hueI=box.querySelector('.hue'),lightI=box.querySelector('.light');
  const sws=presets.map(c=>{
    const b=document.createElement('button');
    b.className='sw';b.style.background=c;b.setAttribute('aria-label',c);
    b.onclick=()=>setColor(c);
    row.appendChild(b);return b;
  });
  const cust=document.createElement('button');
  cust.className='sw custom';cust.setAttribute('aria-label','Custom colour');
  cust.onclick=()=>{box.classList.toggle('open');syncSliders()};
  row.appendChild(cust);
  function tint(){lightI.style.background='linear-gradient(to right,#000,'+hslToHex(+hueI.value,85,50)+',#fff)'}
  function syncSliders(){const [h,,l]=hexToHsl(getColor());hueI.value=Math.round(h);lightI.value=Math.round(l);tint()}
  function fromSliders(){setColor(hslToHex(+hueI.value,85,+lightI.value));tint()}
  hueI.oninput=fromSliders;lightI.oninput=fromSliders;
  tint();
  return{
    refresh(){
      const c=getColor().toLowerCase();let hit=false;
      sws.forEach((b,i)=>{const on=presets[i]===c;b.classList.toggle('sel',on);hit=hit||on});
      cust.classList.toggle('sel',!hit);
    },
    syncSliders
  };
}
const bgPicker=makePicker('bgPick',BG_PRESETS,()=>bg,c=>{bg=c;applyColors()});
const fgPicker=makePicker('fgPick',FG_PRESETS,()=>fg,c=>{fg=c;applyColors()});

function applyColors(){
  fgRGB=hexToRgb(fg);
  document.documentElement.style.background=bg;
  document.body.style.background=bg;
  bgPicker.refresh();fgPicker.refresh();
  save();
}

// Restore saved settings when running inside the Android app.
if(HAS_ANDROID){
  try{
    const p=JSON.parse(Android.getPrefs());
    countInput.value=p.count;speedInput.value=p.speed;linkInput.value=p.links;
    bg=p.bg;fg=p.fg;
  }catch(e){}
  document.getElementById('setwp').style.display='block';
}
function save(){
  if(HAS_ANDROID) Android.savePrefs(+countInput.value,+speedInput.value,+linkInput.value,bg,fg);
}

function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;makeParticles()}
function makeParticles(){const n=+countInput.value;particles=[];
 for(let i=0;i<n;i++)particles.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5),vy:(Math.random()-.5),r:Math.random()*2.2+1.2});}

addEventListener('resize',resize);
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
canvas.addEventListener('touchstart',e=>{const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY},{passive:true});
canvas.addEventListener('touchmove',e=>{const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY},{passive:true});
canvas.addEventListener('touchend',()=>{mouse.x=mouse.y=-9999});
addEventListener('mouseleave',()=>{mouse.x=mouse.y=-9999});

countInput.oninput=()=>{makeParticles();save()};
speedInput.oninput=save;
linkInput.oninput=save;
document.getElementById('theme').onclick=()=>{
  themeIdx=(themeIdx+1)%THEMES.length;
  bg=THEMES[themeIdx].bg;fg=THEMES[themeIdx].fg;
  bgPicker.syncSliders();fgPicker.syncSliders();
  applyColors();
};
document.getElementById('setwp').onclick=()=>{save();Android.setWallpaper()};
const ui=document.getElementById('ui'),gear=document.getElementById('gear');
gear.onclick=()=>{const h=ui.classList.toggle('hidden');gear.textContent=h?'Settings':'Hide'};

function draw(){
 const speed=+speedInput.value/1000,linkDist=+linkInput.value;
 const rgb=fgRGB.join(',');
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='rgba('+rgb+',0.9)';
 for(const p of particles){
  p.x+=p.vx*speed*60;p.y+=p.vy*speed*60;
  if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
  const dx=mouse.x-p.x,dy=mouse.y-p.y,d=Math.hypot(dx,dy);
  if(d<140){p.x-=dx/d*1.4;p.y-=dy/d*1.4}
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
 }
 ctx.lineWidth=1.3;
 for(let i=0;i<particles.length;i++)for(let j=i+1;j<particles.length;j++){
  const a=particles[i],b=particles[j],d=Math.hypot(a.x-b.x,a.y-b.y);
  if(d<linkDist){ctx.strokeStyle='rgba('+rgb+','+(1-d/linkDist)*0.55+')';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
 }
 requestAnimationFrame(draw);
}
resize();applyColors();draw();
</script>
</body>
</html>
